spring:
  datasource:
    # Persistent local H2 database. Override AUDIT_DB_PATH when needed.
    url: "jdbc:h2:file:${AUDIT_DB_PATH:./data/audit-log};AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: "${AUDIT_DB_USERNAME:sa}"
    password: "${AUDIT_DB_PASSWORD:}"
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    enabled: true
    jwt-secret: "${JWT_SECRET:local-development-jwt-secret-must-be-at-least-32-characters}"
    username: "${AUTH_USERNAME:admin}"
    password: "${AUTH_PASSWORD:change-me-local}"
    token-validity-seconds: 3600
